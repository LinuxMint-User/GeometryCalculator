# =============================================================================
# Release 自动构建工作流
#
# 触发方式：
#   1. 推送 v* 标签（如 v2.5.0）→ 三平台桌面 + Android APK 构建，
#      产物挂到 GitHub Release【草稿】（draft，不公开，需人工检查后发布）
#   2. workflow_dispatch 手动触发 → 仅构建并上传为 workflow artifacts，
#      不创建任何 Release（用于测试构建链路）
#
# 设计要点：
#   - 全手动构建（不依赖 tauri-action）：各平台显式安装系统依赖与 tauri-cli，
#     日志清晰、行为可控
#   - 前端零构建：frontendDist 直连 + beforeBuildCommand 为空，无需 Node 打包
#   - Android 用 JDK 21：处于官方 Gradle 8.14.3 支持范围，无需 Gradle 9 补丁
#     （补丁仅在本机 JDK 25+ 环境需要，build.sh 已自动处理）
#   - 发布永远是草稿：机器只负责构建与挂产物，发布动作由维护者人工完成
# =============================================================================
name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 创建发布草稿所需

jobs:
  # ================= 桌面端：Linux =================
  desktop-linux:
    name: Desktop Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node（提供 npx 运行预编译 tauri CLI）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装系统依赖（GTK3 / WebKit2GTK 4.1 等）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev

      - name: 构建安装包（deb / rpm / AppImage）
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@^2 build --bundles deb,rpm,appimage

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  # ================= 桌面端：Windows =================
  desktop-windows:
    name: Desktop Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node（提供 npx 运行预编译 tauri CLI）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建安装包（NSIS .exe）
        working-directory: src-tauri
        shell: bash
        run: npx --yes @tauri-apps/cli@^2 build --bundles nsis

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  # ================= 桌面端：macOS =================
  desktop-macos:
    name: Desktop macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node（提供 npx 运行预编译 tauri CLI）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建安装包（app / dmg）
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@^2 build --bundles app,dmg

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  # ================= Android APK =================
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node（Gradle rust 插件执行入口需要）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装 Rust 与 Android 交叉编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Android SDK（platform 36 + NDK）
        uses: android-actions/setup-android@v3

      - name: 生成 Android 工程
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@^2 android init

      - name: 构建 debug APK（universal，四 ABI 全打）
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@^2 android build --apk --debug

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error

  # ================= 汇总并创建发布草稿 =================
  release:
    name: 汇总产物并创建发布草稿
    if: startsWith(github.ref, 'refs/tags/') # 仅 tag 触发时发布；手动触发只留 artifacts
    needs: [desktop-linux, desktop-windows, desktop-macos, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: 生成发布说明（changelog 提取 + 校验和表格）与 sha256sums.txt
        run: |
          python3 - <<'PY'
          import glob, hashlib, os, re

          tag = os.environ["GITHUB_REF_NAME"]        # 形如 v2.5.0
          version = tag.lstrip("v")                  # 形如 2.5.0

          # 收集全部产物并计算 SHA256
          files = sorted(
              f for f in glob.glob("release-assets/**/*", recursive=True)
              if os.path.isfile(f)
          )
          sums = []
          for f in files:
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              sums.append((os.path.basename(f), h))

          # 从更新日志提取当前版本的条目（去掉章节标题行，避免与正文标题重复）
          changelog = open("frontend/doc/maintainer/changelog.md", encoding="utf-8").read()
          m = re.search(
              r"^## v" + re.escape(version) + r".*?(?=^## v|\Z)",
              changelog, re.M | re.S,
          )
          notes = m.group(0) if m else None
          if notes:
              notes = re.sub(r"^## .*\n?", "", notes, count=1).strip()
          else:
              notes = f"（更新日志中未找到 v{version} 条目，请补充）"

          # 组装发布说明正文（单行拼接，避免多行 f-string 破坏 YAML 块标量缩进）
          rows = "\n".join(f"| {name} | `{h[:8]}` |" for name, h in sums)
          body = (
              f"## {tag}（自动构建草稿）\n\n"
              f"{notes}\n\n"
              "### 安装包与校验和\n\n"
              "| 文件 | SHA256（前 8 位） |\n"
              "|---|---|\n"
              f"{rows}\n\n"
              "> 由 GitHub Actions 自动构建，**尚未正式发布**。\n"
              "> APK 为 debug 自测版（未签名）。请逐一下载验证，确认无误后手动发布本草稿。\n"
          )
          open("release_body.md", "w", encoding="utf-8").write(body)

          # 生成校验和文件
          with open("release-assets/sha256sums.txt", "w", encoding="utf-8") as out:
              for name, h in sums:
                  out.write(f"{h}  {name}\n")
          PY

      - name: 创建发布草稿（不公开，人工确认后发布）
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            release-assets/**/*
