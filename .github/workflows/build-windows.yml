# Windows 桌面安装包构建（NSIS .exe）
#
# 触发方式：
#   - workflow_dispatch：Actions 面板手动触发（单平台构建，不发布）
#   - workflow_call：被 release.yml（tag 触发）调用，作为全量发布的一部分
name: Build Windows

on:
  workflow_call:
  workflow_dispatch:

jobs:
  desktop-windows:
    name: Desktop Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node（npm 全局安装 tauri CLI 需要）
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 注意：Git Bash 下 npx 会静默失败（无输出且退出码 0，cargo 从不执行），
      # 必须用 PowerShell（shell: pwsh）+ npm 全局安装后直接调 tauri。
      - name: 构建安装包（NSIS .exe）
        working-directory: src-tauri
        shell: pwsh
        run: |
          npm install -g @tauri-apps/cli@^2
          tauri --version
          tauri build --bundles nsis
          # 收集产物到固定目录
          New-Item -ItemType Directory -Force -Path ..\dist-win | Out-Null
          $exes = Get-ChildItem -Path target\release\bundle\nsis -Filter *.exe -ErrorAction SilentlyContinue
          if ($exes) {
            foreach ($e in $exes) { Copy-Item $e.FullName ..\dist-win\ -Verbose }
          } else {
            Write-Host "!!! 未找到 nsis 产物，target 结构如下："
            Get-ChildItem -Recurse target | Select-Object -First 40
            exit 1
          }
          # 便携版：复制原始 exe（单文件免安装，需系统已装 WebView2 Runtime）
          $rawExe = "target\release\geometry-calculator.exe"
          if (Test-Path $rawExe) {
            $setup = Get-ChildItem -Path target\release\bundle\nsis -Filter *-setup.exe | Select-Object -First 1
            $portableName = if ($setup) { $setup.Name -replace '-setup\.exe$', '-portable.exe' } else { "geometry-calculator-portable.exe" }
            Copy-Item $rawExe (Join-Path ..\dist-win $portableName) -Verbose
          } else {
            Write-Host "!!! 未找到原始 exe：$rawExe"
            exit 1
          }

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist-win/
          if-no-files-found: error
