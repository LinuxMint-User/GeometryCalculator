# Windows 桌面安装包构建（NSIS .exe）
#
# 触发方式：
#   - workflow_dispatch：Actions 面板手动触发（单平台构建，不发布）
#   - workflow_call：被 release.yml（tag 触发）调用，作为全量发布的一部分
name: Build Windows

on:
  workflow_call:
  workflow_dispatch:

jobs:
  desktop-windows:
    name: Desktop Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node（提供 npx 运行预编译 tauri CLI）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Git Bash 下 npx 静默失败（无输出、退出码 0、不执行任何构建），
      # 因此改用 PowerShell 原生执行 + npm 全局安装 CLI，避免 npx shim 问题。
      - name: 安装 tauri CLI 并构建安装包（NSIS .exe）
        working-directory: src-tauri
        shell: pwsh
        run: |
          Write-Host "=== 1. 安装 tauri CLI ==="
          npm install -g @tauri-apps/cli@^2
          Write-Host "=== 2. CLI 版本 ==="
          tauri --version
          Write-Host "=== 3. 构建前 target 状态 ==="
          if (Test-Path target) { Get-ChildItem target | Select-Object -First 20 } else { Write-Host "target 不存在（首次构建）" }
          Write-Host "=== 4. 开始构建 ==="
          tauri build --bundles nsis
          Write-Host "=== 5. 构建后 target/release 状态 ==="
          if (Test-Path target/release) { Get-ChildItem -Recurse target/release | Select-Object -First 80 } else { Write-Host "target/release 不存在！" }
          Write-Host "=== 6. 全部 exe/msi ==="
          Get-ChildItem -Path target -Recurse -Include *.exe,*.msi -ErrorAction SilentlyContinue | Select-Object -First 20 -ExpandProperty FullName
          Write-Host "=== 7. 复制产物 ==="
          New-Item -ItemType Directory -Force -Path ..\dist-win | Out-Null
          $exes = Get-ChildItem -Path target\release\bundle\nsis -Filter *.exe -ErrorAction SilentlyContinue
          if ($exes) {
            foreach ($e in $exes) { Copy-Item $e.FullName ..\dist-win\ -Verbose }
          } else {
            Write-Host "!!! 未找到 nsis 产物（上方第 5/6 步可见 target 结构）"
            exit 1
          }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-win/
          if-no-files-found: error
