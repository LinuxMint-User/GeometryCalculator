# Windows 桌面安装包构建（NSIS .exe）
#
# 触发方式：
#   - workflow_dispatch：Actions 面板手动触发（单平台构建，不发布）
#   - workflow_call：被 release.yml（tag 触发）调用，作为全量发布的一部分
name: Build Windows

on:
  workflow_call:
  workflow_dispatch:

jobs:
  desktop-windows:
    name: Desktop Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node（提供 npx 运行预编译 tauri CLI）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 构建/诊断/收集合并一步：构建步骤"成功"却无产物的历史问题，
      # 一次日志输出全貌（CLI 版本、target 结构、构建过程、复制产物）
      - name: 构建并收集产物
        working-directory: src-tauri
        shell: bash
        run: |
          echo "=== 1. CLI 版本 ==="
          npx --yes @tauri-apps/cli@^2 --version
          echo "=== 2. 构建前 target 状态 ==="
          ls -la target 2>&1 | head -20 || true
          echo "=== 3. 开始构建 ==="
          npx --yes @tauri-apps/cli@^2 build --bundles nsis
          echo "=== 4. 构建后 target/release 状态 ==="
          ls -laR target/release 2>&1 | head -80 || true
          echo "=== 5. 全部 exe/msi ==="
          find target -iname "*.exe" -o -iname "*.msi" 2>&1 | head -20 || true
          echo "=== 6. 复制产物 ==="
          mkdir -p ../dist-win
          if ls target/release/bundle/nsis/*.exe >/dev/null 2>&1; then
            cp -v target/release/bundle/nsis/*.exe ../dist-win/
          else
            echo "!!! 未找到 nsis 产物（上方第 4/5 步可见 target 结构）"
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-win/
          if-no-files-found: error
