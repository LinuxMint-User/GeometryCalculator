# Linux 桌面安装包构建（deb / rpm / AppImage）
#
# 触发方式：
#   - workflow_dispatch：Actions 面板手动触发（单平台构建，不发布）
#   - workflow_call：被 release.yml（tag 触发）调用，作为全量发布的一部分
name: Build Linux

on:
  workflow_call:
  workflow_dispatch:

jobs:
  desktop-linux:
    name: Desktop Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node（提供 npx 运行预编译 tauri CLI）
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 安装系统依赖（GTK3 / WebKit2GTK 4.1 等）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            squashfs-tools

      # 前端需先构建：esbuild 打包并降级到 Chrome 74 语法（Android 9 自带 WebView
      # 内核），产物在 frontend/dist/（tauri frontendDist 已指向该目录）
      - name: 构建前端（esbuild 转译）
        working-directory: frontend
        run: npm ci && npm run build

      - name: 构建安装包（deb / rpm / AppImage）
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@^2 build --bundles deb,rpm,appimage

      # AppImage 通病修复：linuxdeploy 默认把构建机的 libwayland-* 打进包，
      # 在 Mesa 25+ 的新发行版（如 Fedora 44）上，系统 Mesa EGL 被迫走打包的旧
      # libwayland → EGL_BAD_PARAMETER → WebKitWebProcess 崩溃（白屏）。
      # 剥掉 libwayland-* 后重打包。参考 tauri-apps/tauri#15665。
      - name: 修复 AppImage（剥离打包的 libwayland）
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          APPIMG=$(ls target/release/bundle/appimage/*.AppImage 2>/dev/null | head -1)
          [ -n "$APPIMG" ] || { echo "未找到 AppImage，跳过"; exit 0; }
          # 提取 AppDir（AppImage 运行时自带解包，无需 FUSE）
          "$APPIMG" --appimage-extract >/dev/null
          rm -f squashfs-root/usr/lib/libwayland-*.so*
          # AppImage type-2 头部：第 8 字节起为小端 u64，即 squashfs 偏移
          OFFSET=$(od -An -tu8 -j8 -N8 "$APPIMG" | tr -d ' ')
          head -c "$OFFSET" "$APPIMG" > runtime.bin
          mksquashfs squashfs-root fixed.sfs -noappend -comp zstd -b 1048576 >/dev/null
          cat runtime.bin fixed.sfs > "$APPIMG.tmp"
          chmod +x "$APPIMG.tmp"
          mv -f "$APPIMG.tmp" "$APPIMG"
          rm -rf squashfs-root runtime.bin fixed.sfs
          echo "已重打包: $APPIMG（$(du -h "$APPIMG" | cut -f1)）"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
