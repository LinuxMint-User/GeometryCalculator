# Linux 桌面安装包构建（deb / rpm / AppImage）
#
# 触发方式：
#   - workflow_dispatch：Actions 面板手动触发（单平台构建，不发布）
#   - workflow_call：被 release.yml（tag 触发）调用，作为全量发布的一部分
name: Build Linux

on:
  workflow_call:
  workflow_dispatch:

jobs:
  desktop-linux:
    name: Desktop Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node（提供 npx 运行预编译 tauri CLI）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装系统依赖（GTK3 / WebKit2GTK 4.1 等）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev

      - name: 构建安装包（deb / rpm / AppImage）
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@^2 build --bundles deb,rpm,appimage

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
