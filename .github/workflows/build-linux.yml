# Linux 桌面安装包构建（deb / rpm）
#
# 触发方式：
#   - workflow_dispatch：Actions 面板手动触发（单平台构建，不发布）
#   - workflow_call：被 release.yml（tag 触发）调用，作为全量发布的一部分
name: Build Linux

on:
  workflow_call:
  workflow_dispatch:

jobs:
  desktop-linux:
    name: Desktop Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node（提供 npx 运行预编译 tauri CLI）
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 安装系统依赖（GTK3 / WebKit2GTK 4.1 等）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev

      # 前端需先构建：esbuild 打包并降级到 Chrome 74 语法（Android 9 自带 WebView
      # 内核），产物在 frontend/dist/（tauri frontendDist 已指向该目录）
      - name: 构建前端（esbuild 转译）
        working-directory: frontend
        run: npm ci && npm run build

      # 不发布 AppImage：linuxdeploy 会把构建机的 GTK/WebKitGTK/libwayland 等
      # 打包装进包，在新发行版（如 Fedora 44 / Mesa 26）上白屏、启动崩溃、
      # 输入卡死等问题反复出现；deb / rpm 用系统依赖库，兼容性稳定。
      # 参考 tauri-apps/tauri#15665。
      - name: 构建安装包（deb / rpm）
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@^2 build --bundles deb,rpm

      - name: 上传产物（只挑安装包，不传 deb/rpm 打包中间文件）
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
