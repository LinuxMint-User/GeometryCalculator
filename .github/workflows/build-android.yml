# Android APK 构建（universal，四 ABI）
#
# 触发方式：
#   - workflow_dispatch：Actions 面板手动触发（单平台构建，不发布）
#   - workflow_call：被 release.yml（tag 触发）调用，作为全量发布的一部分
#
# 注意：使用 JDK 21 走官方 Gradle 8.14.3 流程，无需 Gradle 9 补丁
# （补丁仅在本机 JDK 25+ 环境需要，build.sh 已自动处理）
name: Build Android

on:
  workflow_call:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node（Gradle rust 插件执行入口需要）
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 安装 Rust 与 Android 交叉编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Android SDK（platform 36 + NDK）
        uses: android-actions/setup-android@v4

      - name: 安装 tauri CLI（npm 全局安装，Gradle BuildTask 经 PATH 调用）
        run: npm install -g @tauri-apps/cli@^2

      - name: 生成 Android 工程
        working-directory: src-tauri
        run: tauri android init

      # 复用 build.sh：CI 走官方 Gradle 8.14.3 + JDK 21，--ci 模式跳过
      # Gradle 9 兼容补丁（1-3），应用 BuildTask 弃用修复 + 应用名中英自适应
      - name: 打 Android 工程补丁
        run: |
          source build.sh
          apply_android_patches --ci

      - name: 构建 universal debug APK（四 ABI 全打）
        working-directory: src-tauri
        run: tauri android build --apk --debug

      # 单架构小包：只组装 APK，必须排除 rust 任务（rustBuild*）——
      # `tauri android android-studio-script` 需要 tauri CLI 进程当 WebSocket 服务端，
      # 脱离 CLI 直接跑 gradle 会 Connection refused；so 已由上一步 universal
      # 构建编译并链接进 jniLibs，直接复用。
      - name: 构建单架构 debug APK（arm64-v8a / armeabi-v7a / x86 / x86_64）
        working-directory: src-tauri/gen/android
        shell: bash
        run: |
          ./gradlew assembleArm64Debug -x rustBuildArm64Debug \
            assembleArmDebug -x rustBuildArmDebug \
            assembleX86Debug -x rustBuildX86Debug \
            assembleX86_64Debug -x rustBuildX86_64Debug

      # AGP 8 无 Gradle 层改 APK 文件名的 API，统一在产物目录内重命名
      # （<应用名>_<版本>_<flavor>-<buildType>.apk），与 build.sh 保持一致
      - name: 重命名 APK 产物
        run: |
          source build.sh
          rename_android_apk src-tauri/gen/android/app/build/outputs/apk/universal/debug universal
          rename_android_apk src-tauri/gen/android/app/build/outputs/apk/arm64/debug arm64-v8a
          rename_android_apk src-tauri/gen/android/app/build/outputs/apk/arm/debug armeabi-v7a
          rename_android_apk src-tauri/gen/android/app/build/outputs/apk/x86/debug x86
          rename_android_apk src-tauri/gen/android/app/build/outputs/apk/x86_64/debug x86_64

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
            src-tauri/gen/android/app/build/outputs/apk/arm64/debug/*.apk
            src-tauri/gen/android/app/build/outputs/apk/arm/debug/*.apk
            src-tauri/gen/android/app/build/outputs/apk/x86/debug/*.apk
            src-tauri/gen/android/app/build/outputs/apk/x86_64/debug/*.apk
          if-no-files-found: error
