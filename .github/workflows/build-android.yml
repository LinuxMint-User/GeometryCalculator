# Android APK 构建（universal，四 ABI）
#
# 触发方式：
#   - workflow_dispatch：Actions 面板手动触发（单平台构建，不发布）
#   - workflow_call：被 release.yml（tag 触发）调用，作为全量发布的一部分
#
# 注意：使用 JDK 21 走官方 Gradle 8.14.3 流程，无需 Gradle 9 补丁
# （补丁仅在本机 JDK 25+ 环境需要，build.sh 已自动处理）
name: Build Android

on:
  workflow_call:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node（Gradle rust 插件执行入口需要）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装 Rust 与 Android 交叉编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Android SDK（platform 36 + NDK）
        uses: android-actions/setup-android@v3

      - name: 生成 Android 工程
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@^2 android init

      - name: 构建 debug APK（universal，四 ABI 全打）
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@^2 android build --apk --debug

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
